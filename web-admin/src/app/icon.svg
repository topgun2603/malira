<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="RK Matrimony">
  <!-- The same nameplate the Flutter launcher icon draws: a saffron rule, a
       the initials, a cream rule. Rose ground, because the product opens on
       matrimony. -->
  <defs>
    <linearGradient id="rk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E1E3B"/>
      <stop offset="1" stop-color="#9C3464"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#rk)"/>
  <!-- Equal weights: at 16px an unequal pair reads as one rule and a smudge. -->
  <rect x="5.1" y="7.1" width="21.8" height="1.6" rx="0.8" fill="#DD872B"/>
  <rect x="5.1" y="23.3" width="21.8" height="1.6" rx="0.8" fill="#FAF8F2"/>
  <!-- The initials as stroked paths rather than text: a favicon cannot depend
       on a font being available on the machine rendering it. -->
  <g fill="none" stroke="#FAF8F2" stroke-width="2.6" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M8.6 21V11h3.6a2.3 2.3 0 0 1 0 4.6H8.6m2.7 0L15.2 21"/>
    <path d="M18 11v10M24 11l-5.8 5.3M20.2 14.4 24.4 21"/>
  </g>
</svg>
