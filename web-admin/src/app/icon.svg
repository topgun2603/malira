<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MALIRA">
  <!-- The same nameplate the Flutter launcher icon draws: a saffron rule, a
       heavy M, a cream rule. Rose ground, because MALIRA opens on matrimony. -->
  <defs>
    <linearGradient id="malira" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E1E3B"/>
      <stop offset="1" stop-color="#9C3464"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#malira)"/>
  <!-- Equal weights: at 16px an unequal pair reads as one rule and a smudge. -->
  <rect x="6.4" y="7.1" width="19.2" height="1.6" rx="0.8" fill="#DD872B"/>
  <rect x="6.4" y="23.3" width="19.2" height="1.6" rx="0.8" fill="#FAF8F2"/>
  <!-- The M as a stroked path rather than text: a favicon cannot depend on a
       font being available, and butt caps keep the stems clear of the rules. -->
  <path d="M10.5 21.5V10.5L16 17.5 21.5 10.5V21.5"
        fill="none" stroke="#FAF8F2" stroke-width="3" stroke-linejoin="round"/>
</svg>
